<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工廠監控趨勢圖</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:18px;color:#172033}
h1{text-align:center}
.card{background:white;border-radius:12px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #ccc}
.value{font-size:28px;font-weight:bold}
canvas{width:100%;max-height:260px}
</style>
</head>
<body>
<h1>工廠監控系統</h1>
<p style="text-align:center">電壓・電流・功率即時趨勢</p>
<div class="card">電壓：<span class="value" id="v">220.0</span> V</div>
<div class="card">電流：<span class="value" id="i">2.0</span> A</div>
<div class="card">功率：<span class="value" id="p">440.0</span> W</div>
<div class="card"><h3>電壓趨勢 (V)</h3><canvas id="cv"></canvas></div>
<div class="card"><h3>電流趨勢 (A)</h3><canvas id="ci"></canvas></div>
<div class="card"><h3>功率趨勢 (W)</h3><canvas id="cp"></canvas></div>
<script>
const labels=[],V=[],I=[],P=[];
function make(id,name,color,data){
 return new Chart(document.getElementById(id),{
  type:'line',
  data:{labels:labels,datasets:[{label:name,data:data,borderColor:color,borderWidth:2,pointRadius:0,tension:.25}]},
  options:{responsive:true,animation:false,scales:{x:{ticks:{maxTicksLimit:6}}}}
 });
}
const cv=make('cv','電壓','#0d9488',V);
const ci=make('ci','電流','#2563eb',I);
const cp=make('cp','功率','#d97706',P);
function update(){
 const now=new Date();
 const time=now.toLocaleTimeString('zh-TW',{hour12:false});
 const voltage=220+Math.random()*4-2;
 const current=2+Math.random()*.4-.2;
 const power=voltage*current;
 labels.push(time);V.push(+voltage.toFixed(2));
 I.push(+current.toFixed(2));P.push(+power.toFixed(2));
 if(labels.length>60){labels.shift();V.shift();I.shift();P.shift();}
 document.getElementById('v').textContent=voltage.toFixed(2);
 document.getElementById('i').textContent=current.toFixed(2);
 document.getElementById('p').textContent=power.toFixed(2);
 cv.update();ci.update();cp.update();
}
update();setInterval(update,1000);
</script>
</body>
</html>
